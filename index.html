<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --paper: #F6F5F1;
    --card: #FFFFFF;
    --ink: #25241F;
    --ink-muted: #6E6C61;
    --border: #E1DED4;
    --sage: #3F5B4C;
    --sage-dim: #E4ECE7;
    --amber: #A97A34;
    --violet: #6B4FA0;
    --red: #B8453A;
  }
  * { box-sizing: border-box; min-width: 0; }
  html, body { margin:0; background:var(--paper); overflow-x:hidden; }
  body {
    color: var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:70px;
  }
  .wrap { max-width:520px; margin:0 auto; padding:20px 16px 20px; }

  .wordmark { font-family:'Fraunces', serif; font-weight:700; font-size:17px; text-align:center; margin:0 0 18px; }

  .engine-status { display:none; align-items:center; justify-content:center; gap:7px; text-align:center; font-size:11.5px; color:var(--ink-muted); margin:-8px 0 16px; }
  .engine-status.show { display:flex; }
  .engine-status-dot { width:6px; height:6px; border-radius:50%; background:var(--sage); flex:none; animation:engine-pulse 1.2s ease-in-out infinite; }
  @keyframes engine-pulse { 0%,100% { opacity:0.3; } 50% { opacity:1; } }

  .shortcuts { display:flex; justify-content:space-between; margin-bottom:22px; }
  .shortcut { text-align:center; width:70px; background:none; border:none; font-family:inherit; cursor:pointer; }
  .shortcut-icon { width:48px; height:48px; border-radius:50%; background:var(--card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; margin:0 auto 4px; }
  .shortcut-icon svg { width:20px; height:20px; }
  .shortcut-label { font-size:10px; color:var(--ink-muted); }

  .section-label { font-size:10.5px; font-weight:600; color:var(--ink-muted); text-transform:uppercase; letter-spacing:0.05em; margin:0 0 10px; }

  .carousel { display:flex; gap:10px; overflow-x:auto; margin:0 -16px 8px; padding:0 16px 4px; scroll-snap-type:x mandatory; }
  .carousel::-webkit-scrollbar { display:none; }
  .decision-card { flex:0 0 240px; scroll-snap-align:start; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; }
  .decision-title { font-family:'Fraunces', serif; font-weight:600; font-size:13.5px; margin-bottom:4px; }
  .decision-sub { font-size:11.5px; color:var(--ink-muted); line-height:1.45; margin-bottom:6px; }
  .decision-move { font-size:11px; color:var(--ink); }
  .decision-move b { color:var(--red); font-weight:600; }
  .decision-copy { display:inline-flex; margin-top:6px; padding:5px 12px; border-radius:999px; border:1.5px solid var(--violet); background:transparent; color:var(--violet); font-size:11px; font-weight:600; cursor:pointer; }
  .dots { display:flex; justify-content:center; gap:5px; margin:8px 0 24px; }
  .dot { width:5px; height:5px; border-radius:50%; background:var(--border); }
  .dot.active { background:var(--sage); }
  .carousel-empty { text-align:center; font-size:12.5px; color:var(--ink-muted); padding:16px; border:1px solid var(--border); border-radius:14px; background:var(--card); margin-bottom:24px; }

  .proj-row { display:flex; justify-content:space-between; align-items:center; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:11px 13px; margin-bottom:7px; text-decoration:none; color:inherit; }
  .proj-name { font-size:12.5px; font-weight:500; }
  .proj-type { font-size:9.5px; color:var(--ink-muted); display:block; margin-top:1px; }
  .proj-rail { display:flex; gap:3px; }
  .proj-dot { width:5px; height:5px; border-radius:50%; background:var(--border); }
  .proj-dot.on { background:var(--sage); }
  .view-all { font-size:11px; color:var(--sage); font-weight:600; }
  .row-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }

  .idea-card { background:var(--card); border:1px solid var(--border); border-left:3px solid var(--amber); border-radius:10px; padding:11px 13px; margin-bottom:7px; }
  .idea-title { font-family:'Fraunces', serif; font-weight:600; font-size:13px; margin-bottom:3px; }
  .idea-sub { font-size:11.5px; color:var(--ink-muted); line-height:1.45; }
  .empty-note { font-size:12px; color:var(--ink-muted); font-style:italic; margin-bottom:20px; }

  .tabbar { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--border); display:flex; justify-content:space-around; align-items:center; padding:8px 0 max(8px, env(safe-area-inset-bottom)); z-index:50; }
  .tab { background:none; border:none; color:var(--ink-muted); display:flex; flex-direction:column; align-items:center; font-family:inherit; cursor:pointer; padding:4px; }
  .tab svg { width:20px; height:20px; }
  .tab.active { color:var(--sage); }
  .tab-plus { width:38px; height:38px; border-radius:50%; background:var(--sage); display:flex; align-items:center; justify-content:center; margin-top:-16px; border:3px solid var(--paper); }
  .tab-plus svg { width:18px; height:18px; }

  .capture-overlay { position:fixed; inset:0; background:rgba(37,36,31,0.4); display:none; align-items:flex-end; z-index:100; }
  .capture-overlay.open { display:flex; }
  .capture-sheet { background:var(--card); width:100%; border-radius:20px 20px 0 0; padding:20px; }
  .capture-sheet h3 { font-family:'Fraunces', serif; font-size:16px; margin:0 0 10px; }
  .capture-sheet textarea { width:100%; min-height:90px; border:1px solid var(--border); border-radius:10px; padding:10px; font-family:inherit; font-size:14px; resize:none; }
  .capture-actions { display:flex; gap:8px; margin-top:10px; }
  .capture-btn { flex:1; padding:10px; border-radius:999px; border:none; font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; }
  .capture-save { background:var(--sage); color:#FFF; }
  .capture-cancel { background:var(--sage-dim); color:var(--sage); }
  .capture-status { font-size:12px; color:var(--sage); margin-top:8px; min-height:16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="wordmark">Command Center</div>

  <div class="engine-status" id="engine-status">
    <div class="engine-status-dot"></div>
    <span id="engine-status-text"></span>
  </div>

  <div class="shortcuts">
    <a class="shortcut" href="#ideas" style="text-decoration:none;">
      <div class="shortcut-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.3.25.5.65.5 1.1v.5h6v-.5c0-.45.2-.85.5-1.1A6 6 0 0012 3z" stroke="#A97A34" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="shortcut-label">Ideas</div>
    </a>
    <a class="shortcut" href="/opportunities" style="text-decoration:none;">
      <div class="shortcut-icon"><svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#3F5B4C" stroke-width="1.8"/><path d="M20 20l-4-4" stroke="#3F5B4C" stroke-width="1.8" stroke-linecap="round"/></svg></div>
      <div class="shortcut-label">Opps</div>
    </a>
    <a class="shortcut" href="#projects" style="text-decoration:none;">
      <div class="shortcut-icon"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke="#3F5B4C" stroke-width="1.8"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke="#3F5B4C" stroke-width="1.8"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke="#3F5B4C" stroke-width="1.8"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke="#3F5B4C" stroke-width="1.8"/></svg></div>
      <div class="shortcut-label">Projects</div>
    </a>
    <a class="shortcut" href="/board" style="text-decoration:none;">
      <div class="shortcut-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#B8453A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="shortcut-label">Review</div>
    </a>
  </div>

  <div class="section-label" id="ideas">What to do right now</div>
  <div id="carousel-wrap"><div class="carousel-empty">Loading…</div></div>

  <div class="row-head" id="projects">
    <div class="section-label" style="margin:0;">Projects</div>
    <a class="view-all" href="/board">View all →</a>
  </div>
  <div id="proj-list"><p class="empty-note">Loading…</p></div>

  <div class="section-label" style="margin-top:22px;">Ideas feed</div>
  <div id="ideas-feed"><p class="empty-note">Loading…</p></div>
</div>

<div class="tabbar">
  <button class="tab active" onclick="window.scrollTo({top:0,behavior:'smooth'})">
    <svg viewBox="0 0 24 24" fill="none"><path d="M3 11l9-8 9 8M5 10v10h14V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <a class="tab" href="#ideas" style="text-decoration:none;">
    <svg viewBox="0 0 24 24" fill="none"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.3.25.5.65.5 1.1v.5h6v-.5c0-.45.2-.85.5-1.1A6 6 0 0012 3z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
  <button class="tab" onclick="openCapture()" aria-label="Quick capture">
    <div class="tab-plus"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#FFF" stroke-width="2.3" stroke-linecap="round"/></svg></div>
  </button>
  <a class="tab" href="/opportunities" style="text-decoration:none;">
    <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </a>
  <a class="tab" href="/board" style="text-decoration:none;">
    <svg viewBox="0 0 24 24" fill="none"><circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/></svg>
  </a>
</div>

<div class="capture-overlay" id="capture-overlay">
  <div class="capture-sheet">
    <h3>Quick capture</h3>
    <textarea id="capture-text" placeholder="Type anything — it saves straight to your Inbox."></textarea>
    <div class="capture-actions">
      <button class="capture-btn capture-cancel" onclick="closeCapture()">Cancel</button>
      <button class="capture-btn capture-save" onclick="saveCapture()">Save</button>
    </div>
    <div class="capture-status" id="capture-status"></div>
  </div>
</div>

<script>
  const sbClient = supabase.createClient(
    'https://yxfwduvwhruedjyrtfhx.supabase.co',
    'sb_publishable_aPBSSNTuFRAk0FXsiLq-wQ_J_QMcqCy'
  );

  function openCapture(){ document.getElementById('capture-overlay').classList.add('open'); document.getElementById('capture-text').focus(); }
  function closeCapture(){ document.getElementById('capture-overlay').classList.remove('open'); document.getElementById('capture-text').value=''; document.getElementById('capture-status').textContent=''; }

  async function saveCapture(){
    const text = document.getElementById('capture-text').value.trim();
    const status = document.getElementById('capture-status');
    if(!text){ status.textContent = 'Type something first.'; return; }
    status.textContent = 'Saving…';
    try{
      const { error } = await sbClient.from('items').insert({ title: text, stage: 'inbox' });
      if(error) throw error;
      status.textContent = 'Saved to Inbox.';
      setTimeout(closeCapture, 900);
    } catch(err){
      status.textContent = "Couldn't save — try again (" + (err.message || err) + ")";
    }
  }

  function escapeAttr(str){ return (str || "").replace(/"/g, "&quot;"); }

  function decisionCardHtml({title, sub, move, copyText}){
    const copyBtn = copyText
      ? `<button class="decision-copy" onclick="navigator.clipboard.writeText(this.dataset.text); this.textContent='Copied';" data-text="${escapeAttr(copyText)}">Copy to paste</button>`
      : "";
    return `
      <div class="decision-card">
        <div class="decision-title">${title}</div>
        ${sub ? `<div class="decision-sub">${sub}</div>` : ""}
        ${move ? `<div class="decision-move">Next: <b>${move}</b></div>` : ""}
        ${copyBtn}
      </div>`;
  }

  async function loadCarousel(){
    const wrap = document.getElementById('carousel-wrap');
    try{
      const [pending, approval, urgent] = await Promise.all([
        sbClient.from('pending_actions').select('*').eq('status','open').order('created_at',{ascending:true}),
        sbClient.from('items').select('title,approval_note').eq('awaiting_approval', true),
        sbClient.from('items').select('title,priority_reasoning,next_move,desk_research,build_recommendation').eq('priority_flag','act_now')
      ]);

      const cards = [];
      (pending.data || []).forEach(p => cards.push(decisionCardHtml({ title: p.instruction, copyText: p.paste_content || null })));
      (approval.data || []).forEach(i => cards.push(decisionCardHtml({ title: `Decide: ${i.title}`, sub: i.approval_note })));
      (urgent.data || []).filter(i => i.desk_research || i.build_recommendation).forEach(i =>
        cards.push(decisionCardHtml({ title: `Decide: ${i.title}`, sub: i.priority_reasoning, move: i.next_move }))
      );

      if(!cards.length){
        wrap.innerHTML = `<div class="carousel-empty">Nothing needs a decision right now.</div>`;
        return;
      }
      wrap.innerHTML = `<div class="carousel">${cards.join("")}</div><div class="dots">${cards.map((_,i)=>`<div class="dot${i===0?' active':''}"></div>`).join("")}</div>`;
    } catch(err){ wrap.innerHTML = `<div class="carousel-empty">Couldn't load.</div>`; }
  }

  async function loadProjects(){
    const el = document.getElementById('proj-list');
    try{
      const { data, error } = await sbClient.from('meta_projects').select('*').order('sort_order').limit(6);
      if(error) throw error;
      el.innerHTML = data.map(p => {
        const dots = Array.from({length:5}, (_,i) => `<div class="proj-dot ${i < p.stage_index+1 ? 'on':''}"></div>`).join("");
        const inner = `
          <div><div class="proj-name">${p.name}</div><span class="proj-type">${p.output_type || ''}</span></div>
          <div class="proj-rail">${dots}</div>`;
        return p.url
          ? `<a class="proj-row" href="${p.url}" target="_blank">${inner}</a>`
          : `<div class="proj-row">${inner}</div>`;
      }).join("");
    } catch(err){ el.innerHTML = `<p class="empty-note">Couldn't load.</p>`; }
  }

  async function loadIdeasFeed(){
    const el = document.getElementById('ideas-feed');
    try{
      const [inv, syn] = await Promise.all([
        sbClient.from('inventor_ideas').select('title,priority_reasoning,created_at').eq('priority_flag','act_now'),
        sbClient.from('synthesis_ideas').select('title,priority_reasoning,created_at').eq('priority_flag','act_now')
      ]);
      const combined = [...(inv.data||[]), ...(syn.data||[])].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,5);
      el.innerHTML = combined.length
        ? combined.map(i => `<div class="idea-card"><div class="idea-title">${i.title}</div><div class="idea-sub">${i.priority_reasoning||''}</div></div>`).join("")
        : `<p class="empty-note">Nothing flagged right now.</p>`;
    } catch(err){ el.innerHTML = `<p class="empty-note">Couldn't load.</p>`; }
  }

  const ENGINE_LABELS = { opportunities: 'Opportunity Engine', inventor_pool: 'Inventor Pool', synthesis: 'Synthesis Engine' };
  let engineStatusInterval = null;

  async function checkEngineStatus(){
    const wrap = document.getElementById('engine-status');
    const text = document.getElementById('engine-status-text');
    try{
      const { data, error } = await sbClient.from('engine_runs').select('engine,status,current_step')
        .eq('status','running').order('started_at',{ascending:false}).limit(1).maybeSingle();
      if(error) throw error;
      if(data){
        const label = ENGINE_LABELS[data.engine] || data.engine;
        text.textContent = data.current_step ? `${label} running — ${data.current_step}` : `${label} running`;
        wrap.classList.add('show');
        if(!engineStatusInterval){ engineStatusInterval = setInterval(checkEngineStatus, 15000); }
      } else {
        wrap.classList.remove('show');
        if(engineStatusInterval){ clearInterval(engineStatusInterval); engineStatusInterval = null; }
      }
    } catch(err){
      wrap.classList.remove('show');
      if(engineStatusInterval){ clearInterval(engineStatusInterval); engineStatusInterval = null; }
    }
  }

  loadCarousel();
  loadProjects();
  loadIdeasFeed();
  checkEngineStatus();
</script>
</body>
</html>
