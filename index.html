<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --cyan: #4FB3BF;
    --amber: #D98E4F;
    --text: #F3F5F7;
    --text-muted: #A9B0BE;
    --border: rgba(255,255,255,0.10);
    --card: rgba(255,255,255,0.04);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; background:#0E1116; }
  body {
    color: var(--text);
    font-family:'Public Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(ellipse 140% 60% at 50% 0%, #23305A 0%, #141A28 45%, #0E1116 100%);
    min-height:100vh;
  }
  .wrap { max-width:1200px; margin:0 auto; padding:20px 16px 60px; }

  .wordmark { font-family:'Archivo', sans-serif; font-weight:900; font-size:26px; letter-spacing:-0.01em; margin:0 0 4px; }
  .wordmark span { color:var(--cyan); }

  .navrow { display:flex; gap:10px; margin:16px 0 26px; flex-wrap:wrap; position:sticky; top:0; z-index:100; padding:12px 0; background:rgba(14,17,22,0.85); backdrop-filter:blur(6px); }
  .navrow a { padding:8px 16px; border-radius:999px; background:rgba(255,255,255,0.05); border:2px solid var(--border); color:var(--text); font-size:13px; font-weight:600; text-decoration:none; }
  .navrow a.active { border-color:var(--cyan); color:var(--cyan); }

  .status-line{ font-size:12px; color:var(--text-muted); margin:0 0 20px; }

  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:640px){ .grid{ gap:10px; } .project{ padding:14px; } .project-name{ font-size:15px; } }

  .project {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    display:flex;
    flex-direction:column;
    min-height:180px;
    backdrop-filter: blur(8px);
  }
  .project-head { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:8px; }
  .project-name { font-family:'Archivo', sans-serif; font-weight:700; font-size:16.5px; line-height:1.25; }
  .tag { font-size:10.5px; color:var(--cyan); background:rgba(79,179,191,0.15); border-radius:6px; padding:2px 8px; white-space:nowrap; flex:none; }
  .project-status { color:var(--text-muted); font-size:12.5px; line-height:1.45; margin:0 0 12px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }

  .rail { display:flex; align-items:center; margin-bottom:6px; }
  .rail-step { display:flex; align-items:center; flex:1; }
  .rail-dot { width:7px; height:7px; border-radius:50%; background:var(--border); flex:none; }
  .rail-dot.done { background:var(--cyan); }
  .rail-dot.current { width:10px; height:10px; background:transparent; border:2px solid var(--cyan); }
  .rail-track { flex:1; height:1px; background:var(--border); margin:0 3px; }
  .rail-track.done { background:var(--cyan); }
  .stage-label { font-size:10.5px; color:var(--cyan); font-weight:600; margin-bottom:14px; }

  .foot { margin-top:auto; display:flex; flex-direction:column; gap:10px; }
  .next { font-size:12px; color:var(--text); line-height:1.4; }
  .next b { color:var(--amber); font-weight:600; }
  .btn {
    align-self:flex-start;
    display:inline-block;
    padding:6px 16px;
    border-radius:999px;
    border:2px solid var(--cyan);
    color:var(--cyan);
    text-decoration:none;
    font-size:12.5px;
    font-weight:600;
    background:transparent;
  }
  .btn.muted { border-color:var(--border); color:var(--text-muted); pointer-events:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="wordmark">Command<span> Center</span></h1>

  <div class="navrow">
    <a href="/board">Command Center</a>
    <a href="/opportunities">Opportunities Feed</a>
    <a href="/inventors">Inventor Pool</a>
    <a href="/roster">Inventor Roster</a>
    <a href="/needs">Needs Attention</a>
    <a href="/" class="active">Projects</a>
  </div>

  <p class="status-line" id="status-line">Loading live data…</p>
  <div class="grid" id="projects"></div>
</div>

<script>
  const sbClient = supabase.createClient(
    'https://yxfwduvwhruedjyrtfhx.supabase.co',
    'sb_publishable_aPBSSNTuFRAk0FXsiLq-wQ_J_QMcqCy'
  );
  const STAGES = ["Inbox","Lab","Validating","Building","Shipped"];

  function railHtml(currentIndex){
    let rail = "";
    STAGES.forEach((s, i) => {
      const state = i < currentIndex ? "done" : (i === currentIndex ? "current" : "");
      rail += `<div class="rail-step"><div class="rail-dot ${state}"></div>`;
      if(i < STAGES.length - 1){
        rail += `<div class="rail-track ${i < currentIndex ? "done" : ""}"></div>`;
      }
      rail += `</div>`;
    });
    return `<div class="rail">${rail}</div><div class="stage-label">${STAGES[currentIndex]}</div>`;
  }

  function projectHtml(p){
    let btn;
    if(p.url){
      btn = `<a class="btn" href="${p.url}" target="_blank">Open</a>`;
    } else if(p.slug === 'cannarecall'){
      btn = `<a class="btn muted" href="#">Parked</a>`;
    } else {
      btn = `<a class="btn muted" href="#">Not live yet</a>`;
    }
    return `
      <div class="project">
        <div class="project-head">
          <div class="project-name">${p.name}</div>
          <div class="tag">${p.tag}</div>
        </div>
        <p class="project-status">${p.summary || ""}</p>
        ${railHtml(p.stage_index)}
        <div class="foot">
          <div class="next">Next: <b>${p.next_action || "—"}</b></div>
          ${btn}
        </div>
      </div>`;
  }

  async function load(){
    const statusLine = document.getElementById('status-line');
    const container = document.getElementById('projects');
    try{
      const { data, error } = await sbClient.from('meta_projects').select('*').order('sort_order');
      if(error) throw error;
      container.innerHTML = data.map(projectHtml).join("");
      statusLine.textContent = "Live from Command Center — " + new Date().toLocaleString();
    } catch(err){
      statusLine.textContent = "Couldn't load live data (" + (err.message || err) + ") — check connection.";
    }
  }
  load();
</script>
</body>
</html>
