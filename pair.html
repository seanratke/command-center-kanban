<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pair this phone</title><style>body{font-family:system-ui;background:#F6F5F1;color:#25241F;margin:0;padding:28px}.c{max-width:480px;margin:auto}button{width:100%;padding:16px;border:0;border-radius:14px;background:#3F5B4C;color:white;font-weight:800;font-size:17px}.s{margin-top:18px;color:#706E64;line-height:1.5}</style></head><body><main class="c"><h1>Pair this phone</h1><p>This phone will ask an already trusted Command Center device for approval. No password is sent to this phone.</p><button id="go">Request trusted access</button><div id="s" class="s"></div></main><script>
go.onclick=async()=>{go.disabled=true;s.textContent="Creating secure request…";const r=await fetch("/api/pair-start",{method:"POST"});const x=await r.json();if(!r.ok){s.textContent="Could not start pairing.";go.disabled=false;return}sessionStorage.setItem("pair_request",x.requestToken);const approve=location.origin+"/pair-approve.html#"+x.approvalToken;s.innerHTML="Request ready. Open this approval link on your trusted laptop:<br><br><a href='"+approve+"'>Approve this phone</a><br><br>Waiting for approval…";const timer=setInterval(async()=>{const q=await fetch("/api/pair-consume",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({requestToken:x.requestToken})});if(q.status===200){clearInterval(timer);location.href="/capture"}else if(q.status===410){clearInterval(timer);s.textContent="Pairing expired. Start again.";go.disabled=false}},1500)}
</script></body></html>
