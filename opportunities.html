<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Opportunities Feed</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="manifest" href="/manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,900;1,600&display=swap" rel="stylesheet">
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js");
  });
}
</script>
<style>
  :root {
    --paper: #F6F5F1;
    --card: #FFFFFF;
    --ink: #25241F;
    --ink-muted: #6E6C61;
    --border: #E1DED4;
    --sage: #3F5B4C;
    --sage-dim: #E4ECE7;
    --amber: #A97A34;
    --violet: #6B4FA0;
    --violet-dim: #EFE9F7;
    --red: #B8453A;
  }
  body { font-family: 'Noto Sans', sans-serif; max-width: 780px; margin: 0 auto; padding: 2rem 1rem; color: var(--ink); background: var(--paper); }
  h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 1rem; }
  h2.date { font-size: 1.1rem; font-weight: 600; margin: 2rem 0 1rem; color: var(--ink); }
  h3.board-title { font-size: 1.3rem; font-weight: 800; margin: 2rem 0 0.75rem; padding-bottom: 0.4rem; border-bottom: 3px solid var(--ink); }
  h3.board-title.far-out { border-bottom-color: var(--violet); color: var(--violet); }
  h3.board-title.canada-bc { border-bottom-color: var(--red); color: var(--red); }
  h3.board-title.human-needs { border-bottom-color: var(--violet); color: var(--violet); }
  .board-subtitle { font-size: 0.85rem; color: var(--ink-muted); margin-bottom: 1rem; margin-top: -0.5rem; }
  .card { border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; margin-bottom: 1rem; background: var(--card); }
  .card.top { border: 2px solid var(--ink); }
  .card.discarded { opacity: 0.5; }
  .label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-muted); margin-bottom: 0.35rem; }
  .summary-box { font-size: 0.95rem; color: var(--ink); background: var(--sage-dim); border-left: 4px solid var(--sage); padding: 0.75rem; border-radius: 6px; margin-bottom: 0.75rem; }
  .fit-box { font-size: 0.95rem; color: var(--ink); background: var(--sage-dim); border-left: 4px solid var(--sage); padding: 0.75rem; border-radius: 6px; margin-bottom: 0.75rem; }
  .who-box { font-size: 0.95rem; color: var(--ink); background: var(--violet-dim); border-left: 4px solid var(--violet); padding: 0.75rem; border-radius: 6px; margin-bottom: 0.75rem; }
  .research-box { font-size: 0.95rem; color: var(--ink); background: var(--violet-dim); border-left: 4px solid var(--violet); padding: 0.75rem; border-radius: 6px; margin-bottom: 0.75rem; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; }
  .card-head h4 { font-size: 1.15rem; font-weight: 700; margin: 0; }
  .confidence { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; white-space: nowrap; }
  .confidence.high { color: var(--sage); }
  .confidence.medium { color: var(--amber); }
  .confidence.speculative { color: var(--ink-muted); }
  dl { margin-top: 0.75rem; display: grid; gap: 0.5rem; }
  dt { font-weight: 600; font-size: 0.85rem; }
  dd { margin: 0; }
  .actions { margin-top: 1rem; display: flex; gap: 0.5rem; }
  button { font-size: 0.8rem; padding: 0.35rem 0.75rem; border-radius: 6px; cursor: pointer; font-family: 'Noto Sans', sans-serif; }
  .btn-promote { border: 1px solid var(--ink); background: var(--card); color: var(--ink); }
  .btn-promote.done { background: var(--ink); color: #FFFFFF; }
  .btn-discard { border: 1px solid var(--border); background: var(--card); color: var(--ink-muted); }
  .empty { color: var(--ink-muted); font-style: italic; }
  .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; position: sticky; top: 0; background: var(--paper); padding: 0.5rem 0; z-index: 10; }
  .tab-btn { font-size: 0.85rem; font-weight: 600; padding: 0.5rem 1rem; border-radius: 999px; border: 2px solid var(--border); background: var(--card); color: var(--ink-muted); cursor: pointer; font-family: 'Noto Sans', sans-serif; }
  .tab-btn.active { border-color: var(--ink); background: var(--ink); color: #FFFFFF; }
  .tab-btn.active.far-out { border-color: var(--violet); background: var(--violet); }
  .tab-btn.active.canada-bc { border-color: var(--red); background: var(--red); }
  .tab-btn.active.human-needs { border-color: var(--violet); background: var(--violet); }
  .tab-btn.active.watchlist { border-color: var(--violet); background: var(--violet); }
  .watchlist-form { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 2rem; padding: 1rem; border: 1px dashed var(--border); border-radius: 10px; }
  .watchlist-form input, .watchlist-form textarea { padding: 0.5rem; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 0.9rem; background: var(--card); color: var(--ink); }
  .watchlist-idea { border: 1px solid var(--border); border-radius: 10px; padding: 1rem; margin-bottom: 1rem; background: var(--card); }
  .watchlist-idea h4 { margin: 0 0 0.5rem; }
  .watchlist-flag { font-size: 0.85rem; background: var(--violet-dim); border-left: 3px solid var(--violet); padding: 0.5rem 0.75rem; border-radius: 4px; margin-top: 0.5rem; }
  .status-rail { margin: 0 0 14px; }
  .status-rail-label { font-size: 0.75rem; color: var(--ink-muted); margin: 0 0 6px; font-weight: 600; }
  .rail { display:flex; align-items:center; margin-bottom:4px; max-width:280px; }
  .rail-step { display:flex; align-items:center; flex:1; }
  .rail-dot { width:7px; height:7px; border-radius:50%; background:var(--border); flex:none; }
  .rail-dot.done { background:var(--sage); }
  .rail-dot.current { width:10px; height:10px; background:transparent; border:2px solid var(--sage); }
  .rail-track { flex:1; height:1px; background:var(--border); margin:0 3px; }
  .rail-track.done { background:var(--sage); }
</style>
</head>
<body>
  <h1>Opportunity Feed</h1>
  <div id="status-rail"></div>
  <div class="tabs">
    <button class="tab-btn active" data-filter="all" onclick="setFilter('all')">All</button>
    <button class="tab-btn" data-filter="main" onclick="setFilter('main')">Main</button>
    <button class="tab-btn" data-filter="far_out" onclick="setFilter('far_out')">Far-Out</button>
    <button class="tab-btn" data-filter="canada_bc" onclick="setFilter('canada_bc')">Canada/BC</button>
    <button class="tab-btn" data-filter="human_needs" onclick="setFilter('human_needs')">Human Needs</button>
    <button class="tab-btn" data-filter="watchlist" onclick="setFilter('watchlist')">Watchlist</button>
  </div>
  <div style="margin:0 0 1.5rem;">
    <label style="font-size:0.8rem;color:var(--ink-muted);margin-right:8px;">Confidence:</label>
    <select onchange="setConfidenceFilter(this.value)" style="padding:6px 10px;border-radius:6px;border:1px solid var(--border);font-size:0.85rem;background:var(--card);color:var(--ink);">
      <option value="all">All confidence levels</option>
      <option value="high">High only</option>
      <option value="medium">Medium only</option>
      <option value="speculative">Speculative only</option>
    </select>
  </div>
  <div id="feed"><p class="empty">Loading...</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sbClient = supabase.createClient(
  'https://yxfwduvwhruedjyrtfhx.supabase.co',
  'sb_publishable_aPBSSNTuFRAk0FXsiLq-wQ_J_QMcqCy'
);
const META_STAGES = ["Inbox","Lab","Validating","Building","Shipped"];

function metaRailHtml(currentIndex){
  let rail = "";
  META_STAGES.forEach((s, i) => {
    const st = i < currentIndex ? "done" : (i === currentIndex ? "current" : "");
    rail += `<div class="rail-step"><div class="rail-dot ${st}"></div>`;
    if(i < META_STAGES.length - 1){
      rail += `<div class="rail-track ${i < currentIndex ? "done" : ""}"></div>`;
    }
    rail += `</div>`;
  });
  return `<div class="status-rail"><p class="status-rail-label">Opportunities Engine status</p><div class="rail">${rail}</div></div>`;
}

async function loadMetaStatus() {
  const { data, error } = await sbClient.from('meta_projects').select('stage_index').eq('slug', 'opportunities-engine').single();
  if (!error && data) {
    document.getElementById('status-rail').innerHTML = metaRailHtml(data.stage_index);
  }
}

let currentFilter = 'all';
let currentConfidenceFilter = 'all';

function setConfidenceFilter(val) { currentConfidenceFilter = val; render(); }
let allItems = [];
let watchlistIdeas = [];

const confidenceClass = { high: 'high', medium: 'medium', speculative: 'speculative' };
const boardMeta = {
  main: { title: 'Main Board', subtitle: 'Grounded, buildable-now opportunities', cssClass: '' },
  far_out: { title: 'Far-Out Board', subtitle: 'Bolder, visionary ideas — still real, still viable', cssClass: 'far-out' },
  canada_bc: { title: 'Canada / BC Board', subtitle: 'Rooted in Canadian or BC-specific conditions', cssClass: 'canada-bc' },
  human_needs: { title: 'Human Needs Board', subtitle: 'Starts from one specific person\'s real struggle, researched deeply', cssClass: 'human-needs' }
};

function setFilter(filter) {
  currentFilter = filter;
  document.querySelectorAll('.tab-btn').forEach((btn) => {
    const isActive = btn.dataset.filter === filter;
    btn.classList.toggle('active', isActive);
    btn.classList.remove('far-out', 'canada-bc', 'human-needs', 'watchlist');
    if (isActive && filter !== 'all' && filter !== 'main') btn.classList.add(filter.replace('_', '-'));
  });
  render();
}

async function loadFeed() {
  try {
    const [feedRes, watchlistRes] = await Promise.all([
      fetch('/api/opportunities/list'),
      fetch('/api/seed-ideas/list')
    ]);
    const feedData = await feedRes.json();
    const watchlistData = await watchlistRes.json();
    allItems = feedData.opportunities || [];
    watchlistIdeas = watchlistData.ideas || [];
    render();
  } catch (err) {
    document.getElementById('feed').innerHTML = '<p class="empty">Failed to load feed. Check back later.</p>';
    console.error(err);
  }
}

function render() {
  const feedEl = document.getElementById('feed');

  if (currentFilter === 'watchlist') {
    feedEl.innerHTML = watchlistSectionHtml();
    return;
  }

  if (allItems.length === 0) {
    feedEl.innerHTML = '<p class="empty">No opportunities yet — the first daily run hasn\'t landed.</p>';
    return;
  }

  const grouped = {};
  allItems.forEach((op) => {
    (grouped[op.report_date] = grouped[op.report_date] || []).push(op);
  });
  const dates = Object.keys(grouped).sort().reverse();
  const boardsToShow = currentFilter === 'all' ? ['main', 'far_out', 'canada_bc', 'human_needs'] : [currentFilter];

  feedEl.innerHTML = dates.map((date) => {
    const dayItems = grouped[date];
    const byBoard = { main: [], far_out: [], canada_bc: [], human_needs: [] };
    dayItems.forEach((op) => {
      const cat = op.category || 'main';
      (byBoard[cat] = byBoard[cat] || []).push(op);
    });
    if (currentConfidenceFilter !== 'all') {
      Object.keys(byBoard).forEach((k) => { byBoard[k] = byBoard[k].filter((op) => op.confidence === currentConfidenceFilter); });
    }
    Object.keys(byBoard).forEach((k) => byBoard[k].sort((a, b) => (a.rank || 99) - (b.rank || 99)));

    const sections = boardsToShow.map((boardKey) => boardSectionHtml(boardKey, byBoard[boardKey])).join('');
    if (!sections.trim()) return '';

    return `<h2 class="date">${date}</h2>${sections}`;
  }).join('');
}

function watchlistSectionHtml() {
  const formHtml = `
    <div class="watchlist-form">
      <div class="label">Submit a new idea</div>
      <input type="text" id="new-idea-title" placeholder="Idea title" />
      <textarea id="new-idea-desc" placeholder="Description (optional)" rows="3"></textarea>
      <button class="btn-promote" onclick="submitIdea()">Add to Watchlist</button>
    </div>
  `;

  if (watchlistIdeas.length === 0) {
    return formHtml + '<p class="empty">No ideas on your watchlist yet.</p>';
  }

  const ideasHtml = watchlistIdeas.map((idea) => `
    <div class="watchlist-idea">
      <h4>${escapeHtml(idea.title)}</h4>
      ${idea.description ? `<p>${escapeHtml(idea.description)}</p>` : ''}
      ${idea.flags.length === 0
        ? '<p class="empty">No flags yet — the engine is watching for relevant developments.</p>'
        : idea.flags.map((f) => `<div class="watchlist-flag"><strong>${f.report_date}:</strong> ${escapeHtml(f.note)}</div>`).join('')}
    </div>
  `).join('');

  return formHtml + ideasHtml;
}

async function submitIdea() {
  const title = document.getElementById('new-idea-title').value.trim();
  const description = document.getElementById('new-idea-desc').value.trim();
  if (!title) return;
  await fetch('/api/seed-ideas/create', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title, description })
  });
  await loadFeed();
  setFilter('watchlist');
}

function boardSectionHtml(boardKey, items) {
  const meta = boardMeta[boardKey];
  if (!items || items.length === 0) {
    return `<h3 class="board-title ${meta.cssClass}">${meta.title}</h3><p class="board-subtitle">${meta.subtitle}</p><p class="empty">No opportunities cleared the bar for this board today.</p>`;
  }
  return `<h3 class="board-title ${meta.cssClass}">${meta.title}</h3><p class="board-subtitle">${meta.subtitle}</p>${items.map(cardHtml).join('')}`;
}

function cardHtml(op) {
  const topClass = op.is_top_recommendation ? 'top' : '';
  const discardedClass = op.status === 'discarded' ? 'discarded' : '';
  const promoted = op.status === 'promoted';
  return `
    <article class="card ${topClass} ${discardedClass}" data-id="${op.id}">
      ${op.who_this_is_for ? `<div class="label">Who This Is For</div><p class="who-box">${escapeHtml(op.who_this_is_for)}</p>` : ''}
      ${op.key_summary ? `<div class="label">Plain-Language Summary</div><p class="summary-box">${escapeHtml(op.key_summary)}</p>` : ''}
      ${op.research_grounding ? `<div class="label">Research Grounding</div><p class="research-box">${escapeHtml(op.research_grounding)}</p>` : ''}
      ${op.sean_fit ? `<div class="label">For Sean</div><p class="fit-box">${escapeHtml(op.sean_fit)}</p>` : ''}
      <div class="card-head">
        <h4>${op.is_top_recommendation ? '⭐ ' : ''}${escapeHtml(op.title)}</h4>
        <span class="confidence ${confidenceClass[op.confidence] || ''}">${op.confidence}</span>
      </div>
      <dl>
        <div><dt>The gap</dt><dd>${escapeHtml(op.the_gap)}</dd></div>
        <div><dt>First-principles take</dt><dd>${escapeHtml(op.first_principles_take)}</dd></div>
        <div><dt>Why now</dt><dd>${escapeHtml(op.why_now)}</dd></div>
        <div><dt>What to build first</dt><dd>${escapeHtml(op.what_to_build_first)}</dd></div>
        <div><dt>Why others missed it</dt><dd>${escapeHtml(op.why_others_missed_it)}</dd></div>
      </dl>
      <div class="actions">
        <button class="btn-promote ${promoted ? 'done' : ''}" onclick="promote('${op.id}')">${promoted ? 'Promoted ✓' : 'Promote to Inbox'}</button>
        <button class="btn-discard" onclick="discardItem('${op.id}')">Discard</button>
        <button class="btn-discard" onclick="spark('${op.id}')">✨ Spark ideas</button>
      </div>
      ${sparkHtml(op)}
    </article>
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

async function promote(id) {
  await fetch(`/api/opportunities/${id}/promote`, { method: 'POST' });
  loadFeed();
}

async function discardItem(id) {
  await fetch(`/api/opportunities/${id}/discard`, { method: 'POST' });
  loadFeed();
}

async function spark(id) {
  const btn = event ? event.target : null;
  if (btn) { btn.disabled = true; btn.textContent = 'Sparking...'; }
  try {
    const res = await fetch('/api/spark', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id })
    });
    if (!res.ok) { alert('Spark error: ' + (await res.text())); return; }
  } catch (e) {
    alert('Spark error: ' + e.message);
    return;
  }
  await loadFeed();
}

async function promoteSpark(id, index) {
  const btn = event ? event.target : null;
  if (btn) { btn.disabled = true; btn.textContent = 'Sent ✓'; }
  await fetch('/api/spark-promote', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, index })
  });
}

function sparkHtml(op) {
  if (!op.spark_ideas || op.spark_ideas.length === 0) return '';
  return `
    <div style="margin-top:1rem;padding:1rem;border:1px dashed var(--violet);border-radius:10px;">
      <div class="label" style="margin-bottom:0.75rem;">Spark -- divergent directions</div>
      ${op.spark_ideas.map((s, i) => `
        <div style="margin-bottom:1rem;">
          <p style="font-weight:700;margin:0 0 0.3rem;">${escapeHtml(s.title)}</p>
          <p style="margin:0 0 0.3rem;font-size:0.9rem;">${escapeHtml(s.angle)}</p>
          <p style="margin:0 0 0.5rem;font-size:0.85rem;color:var(--violet);font-style:italic;">${escapeHtml(s.why_different)}</p>
          <button class="btn-discard" onclick="promoteSpark('${op.id}', ${i})">Send to Inbox</button>
        </div>
      `).join('')}
    </div>
  `;
}

loadFeed();
loadMetaStatus();
</script>
<script src="/tabbar.js"></script>
<script>renderTabbar('opportunities');</script>
</body>
</html>
