<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Needs Attention</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="manifest" href="/manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,900;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F6F5F1;
    --card: #FFFFFF;
    --ink: #25241F;
    --ink-muted: #6E6C61;
    --border: #E1DED4;
    --sage: #3F5B4C;
    --sage-dim: #E4ECE7;
    --amber: #A97A34;
    --amber-dim: #F6ECDD;
    --violet: #6B4FA0;
    --violet-dim: #EFE9F7;
  }
  body { font-family: 'Noto Sans', sans-serif; max-width: 780px; margin: 0 auto; padding: 2rem 1rem; color: var(--ink); background: var(--paper); }
  h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 1rem; }
  .row { border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 0.75rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; background: var(--card); }
  .row-title { font-weight: 700; margin: 0 0 4px; }
  .row-meta { font-size: 0.8rem; color: var(--ink-muted); }
  .badge { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .badge-opportunity { background: var(--sage-dim); color: var(--sage); }
  .badge-inbox_item { background: var(--amber-dim); color: var(--amber); }
  .badge-nomination { background: var(--violet-dim); color: var(--violet); }
  .badge-inventor_idea { background: var(--violet-dim); color: var(--violet); }
  .badge-synthesis { background: var(--border); color: var(--ink-muted); }
  a.view-link { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--sage); color: var(--sage); font-size: 0.8rem; text-decoration: none; white-space: nowrap; }
  .empty { color: var(--ink-muted); font-style: italic; }
  .site-nav-link { padding:8px 16px; border-radius:999px; background:var(--card); border:2px solid var(--border); color:var(--ink); font-size:13px; font-weight:600; text-decoration:none; }
  .site-nav-active { border-color:var(--sage); color:var(--sage); background:var(--sage-dim); }
</style>
</head>
<body>
  <h1>Needs Attention</h1>
  <div id="site-nav" style="display:flex;gap:8px;margin:0 0 24px;flex-wrap:wrap;position:sticky;top:0;z-index:100;padding:12px 0;background:var(--paper);"></div>
  <script src="/nav.js"></script>
  <script>renderSiteNav('needs');</script>
  <div id="content"><p class="empty">Loading...</p></div>

<script>
const typeLabels = {
  opportunity: 'Opportunity',
  inbox_item: 'Inbox Item',
  nomination: 'Nomination',
  inventor_idea: 'Inventor Idea',
  synthesis: 'Synthesis'
};

async function loadNeeds() {
  try {
    const res = await fetch('/api/needs/list');
    const data = await res.json();
    render(data.items || []);
  } catch (err) {
    document.getElementById('content').innerHTML = '<p class="empty">Failed to load.</p>';
    console.error(err);
  }
}

function daysAgo(dateStr) {
  const d = Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
  return d === 0 ? 'today' : d === 1 ? '1 day ago' : d + ' days ago';
}

function render(items) {
  const el = document.getElementById('content');
  if (items.length === 0) {
    el.innerHTML = '<p class="empty">Nothing waiting on you right now.</p>';
    return;
  }
  el.innerHTML = items.map(rowHtml).join('');
}

function rowHtml(item) {
  return `
    <div class="row">
      <div>
        <p class="row-title">${escapeHtml(item.title)}</p>
        <p class="row-meta"><span class="badge badge-${item.type}">${typeLabels[item.type] || item.type}</span> &nbsp; ${escapeHtml(String(item.meta))} &nbsp; ${daysAgo(item.created_at)}</p>
      </div>
      <a class="view-link" href="${item.link}">View</a>
    </div>
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

loadNeeds();
</script>
</body>
</html>
