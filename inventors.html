<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Inventor Pool</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="manifest" href="/manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,900;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F6F5F1;
    --card: #FFFFFF;
    --ink: #25241F;
    --ink-muted: #6E6C61;
    --border: #E1DED4;
    --sage: #3F5B4C;
    --sage-dim: #E4ECE7;
    --amber: #A97A34;
    --amber-dim: #F6ECDD;
    --violet: #6B4FA0;
    --violet-dim: #EFE9F7;
  }
  body { font-family: 'Noto Sans', sans-serif; max-width: 780px; margin: 0 auto; padding: 2rem 1rem; color: var(--ink); background: var(--paper); }
  h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
  .back-link { display: inline-block; margin-bottom: 1.5rem; color: var(--ink-muted); font-size: 13px; text-decoration: underline; }
  h2.section-title { font-size: 1.2rem; font-weight: 800; margin: 2rem 0 1rem; padding-bottom: 0.4rem; border-bottom: 3px solid var(--ink); }
  .nomination-card { border: 2px dashed var(--violet); border-radius: 10px; padding: 1.25rem; margin-bottom: 1rem; background: var(--violet-dim); }
  .nomination-card h3 { margin: 0 0 0.5rem; font-size: 1.1rem; }
  .nomination-meta { font-size: 0.8rem; color: var(--ink-muted); margin-bottom: 0.75rem; }
  .nomination-actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
  .inventor-block { border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; margin-bottom: 1.5rem; background: var(--card); }
  .inventor-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.5rem; }
  .inventor-name { font-size: 1.2rem; font-weight: 800; margin: 0; }
  .inventor-domain { font-size: 0.8rem; color: var(--violet); font-weight: 600; text-transform: uppercase; }
  .inventor-persona { font-size: 0.85rem; color: var(--ink-muted); margin: 0 0 1rem; font-style: italic; }
  .idea-card { border-top: 1px solid var(--border); padding-top: 1rem; margin-top: 1rem; }
  .idea-title { font-weight: 700; margin: 0 0 0.4rem; }
  .idea-concept { font-size: 0.9rem; margin: 0 0 0.5rem; }
  .idea-mechanism { font-size: 0.85rem; color: var(--ink-muted); margin: 0 0 0.5rem; }
  .grey-area { font-size: 0.8rem; color: var(--amber); background: var(--amber-dim); padding: 0.5rem 0.75rem; border-radius: 6px; margin: 0 0 0.75rem; }
  .idea-actions { display: flex; gap: 0.5rem; }
  button { font-size: 0.8rem; padding: 0.4rem 0.85rem; border-radius: 6px; cursor: pointer; font-family: 'Noto Sans', sans-serif; }
  .btn-promote { border: 1px solid var(--sage); background: var(--card); color: var(--sage); }
  .btn-discard { border: 1px solid var(--border); background: var(--card); color: var(--ink-muted); }
  .btn-approve { border: 1px solid var(--violet); background: var(--violet); color: #FFFFFF; }
  .empty { color: var(--ink-muted); font-style: italic; }
</style>
</head>
<body>
  <h1>Inventor Pool</h1>
  <div id="content"><p class="empty">Loading...</p></div>

<script>
let inventors = [];
let nominations = [];
let synthesis = [];

async function loadData() {
  try {
    const res = await fetch('/api/inventors/list');
    const data = await res.json();
    inventors = data.inventors || [];
    nominations = data.nominations || [];
    synthesis = data.synthesis || [];
    render();
  } catch (err) {
    document.getElementById('content').innerHTML = '<p class="empty">Failed to load. Check back later.</p>';
    console.error(err);
  }
}

function render() {
  const el = document.getElementById('content');
  let html = '';

  if (synthesis.length > 0) {
    html += '<h2 class="section-title">Synthesis -- connections across the week</h2>';
    html += synthesis.map(synthesisHtml).join('');
  }

  if (nominations.length > 0) {
    html += '<h2 class="section-title">Pending Nominations</h2>';
    html += nominations.map(nominationHtml).join('');
  }

  html += '<h2 class="section-title">Inventors</h2>';
  if (inventors.length === 0) {
    html += '<p class="empty">No active inventors yet.</p>';
  } else {
    html += inventors.map(inventorHtml).join('');
  }

  el.innerHTML = html;
}

function synthesisHtml(s) {
  const isOverlap = s.idea_type === 'overlap';
  const borderColor = isOverlap ? 'var(--amber)' : 'var(--sage)';
  const bg = isOverlap ? 'var(--amber-dim)' : 'var(--sage-dim)';
  const label = isOverlap ? 'OVERLAP -- two systems found the same thing' : 'COMBINATION -- new idea from merging sources';
  return `
    <div class="nomination-card" style="border-color:${borderColor};background:${bg};">
      <p style="font-size:0.7rem;font-weight:700;text-transform:uppercase;color:${borderColor};margin:0 0 6px;">${label}</p>
      <h3>${escapeHtml(s.title)}</h3>
      <p>${escapeHtml(s.concept)}</p>
      <p style="font-size:0.85rem;color:var(--ink-muted);margin:0.5rem 0;">${escapeHtml(s.mechanism)}</p>
      <p style="font-size:0.8rem;color:${borderColor};font-style:italic;">${isOverlap ? 'Overlapping sources' : 'Combines'}: ${escapeHtml(s.source_items)}</p>
      <div class="nomination-actions">
        <button class="btn-promote" onclick="promoteSynthesis('${s.id}')">Promote to Inbox</button>
        <button class="btn-discard" onclick="discardSynthesis('${s.id}')">Discard</button>
      </div>
    </div>
  `;
}

function nominationHtml(n) {
  return `
    <div class="nomination-card">
      <h3>${escapeHtml(n.proposed_domain)}</h3>
      <div class="nomination-meta">Nominated by ${escapeHtml(n.inventors?.name || 'Unknown')}</div>
      <p>${escapeHtml(n.rationale)}</p>
      <div class="nomination-actions">
        <button class="btn-approve" onclick="approveNomination('${n.id}')">Approve &amp; Draft Persona</button>
        <button class="btn-discard" onclick="rejectNomination('${n.id}')">Reject</button>
      </div>
    </div>
  `;
}

let editingInventorId = null;

function inventorHtml(inv) {
  const activeIdeas = (inv.ideas || []).filter(i => i.status === 'new');

  if (editingInventorId === inv.id) {
    return `
      <div class="inventor-block" id="inv-${inv.id}">
        <label style="font-size:0.8rem;font-weight:600;display:block;margin-bottom:4px;">Name</label>
        <input type="text" id="edit-name-${inv.id}" value="${escapeHtml(inv.name)}" style="width:100%;box-sizing:border-box;padding:6px 8px;margin-bottom:10px;border:1px solid var(--border);border-radius:6px;font-size:0.9rem;background:var(--paper);color:var(--ink);" />
        <label style="font-size:0.8rem;font-weight:600;display:block;margin-bottom:4px;">Domain</label>
        <input type="text" id="edit-domain-${inv.id}" value="${escapeHtml(inv.domain)}" style="width:100%;box-sizing:border-box;padding:6px 8px;margin-bottom:10px;border:1px solid var(--border);border-radius:6px;font-size:0.9rem;background:var(--paper);color:var(--ink);" />
        <label style="font-size:0.8rem;font-weight:600;display:block;margin-bottom:4px;">Persona</label>
        <textarea id="edit-persona-${inv.id}" rows="6" style="width:100%;box-sizing:border-box;padding:6px 8px;margin-bottom:10px;border:1px solid var(--border);border-radius:6px;font-size:0.85rem;background:var(--paper);color:var(--ink);">${escapeHtml(inv.persona)}</textarea>
        <div class="idea-actions">
          <button class="btn-promote" onclick="saveInventor('${inv.id}')">Save</button>
          <button class="btn-discard" onclick="cancelEditInventor()">Cancel</button>
        </div>
      </div>
    `;
  }

  return `
    <div class="inventor-block">
      <div class="inventor-header">
        <p class="inventor-name">${escapeHtml(inv.name)}</p>
        <span class="inventor-domain">${escapeHtml(inv.domain)}</span>
      </div>
      <p class="inventor-persona">${escapeHtml(inv.persona)}</p>
      <button class="btn-discard" style="margin-bottom:0.75rem;" onclick="startEditInventor('${inv.id}')">Edit persona</button>
      ${activeIdeas.length === 0
        ? '<p class="empty">No new ideas from this inventor yet.</p>'
        : activeIdeas.map(ideaHtml).join('')}
    </div>
  `;
}

function startEditInventor(id) { editingInventorId = id; render(); }
function cancelEditInventor() { editingInventorId = null; render(); }

async function saveInventor(id) {
  const name = document.getElementById('edit-name-' + id).value.trim();
  const domain = document.getElementById('edit-domain-' + id).value.trim();
  const persona = document.getElementById('edit-persona-' + id).value.trim();
  if (!name || !domain || !persona) { alert('All fields are required.'); return; }

  await fetch('/api/inventors/actions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'update_inventor', id, name, domain, persona })
  });
  editingInventorId = null;
  await loadData();
}

function ideaHtml(idea) {
  return `
    <div class="idea-card">
      <p class="idea-title">${escapeHtml(idea.title)}</p>
      <p class="idea-concept">${escapeHtml(idea.concept)}</p>
      <p class="idea-mechanism">${escapeHtml(idea.mechanism)}</p>
      ${idea.grey_area_note ? `<p class="grey-area">${escapeHtml(idea.grey_area_note)}</p>` : ''}
      <div class="idea-actions">
        <button class="btn-promote" onclick="promoteIdea('${idea.id}')">Promote to Inbox</button>
        <button class="btn-discard" onclick="discardIdea('${idea.id}')">Discard</button>
      </div>
    </div>
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

async function callAction(action, id) {
  await fetch('/api/inventors/actions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, id })
  });
  await loadData();
}

function promoteIdea(id) { callAction('promote', id); }
function discardIdea(id) { callAction('discard', id); }
function rejectNomination(id) { callAction('reject_nomination', id); }
function promoteSynthesis(id) { callAction('promote_synthesis', id); }
function discardSynthesis(id) { callAction('discard_synthesis', id); }
async function approveNomination(id) {
  await callAction('approve_nomination', id);
}

loadData();
</script>
<script src="/tabbar.js"></script>
<script>renderTabbar('inventors');</script>
</body>
</html>
