<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Opportunity Feed</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="manifest" href="/manifest.json" />
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 780px; margin: 0 auto; padding: 2rem 1rem; color: #111827; }
  h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 1rem; }
  h2.date { font-size: 1.1rem; font-weight: 600; margin: 2rem 0 1rem; color: #374151; }
  h3.board-title { font-size: 1.3rem; font-weight: 800; margin: 2rem 0 0.75rem; padding-bottom: 0.4rem; border-bottom: 3px solid #111827; }
  h3.board-title.far-out { border-bottom-color: #7c3aed; color: #5b21b6; }
  h3.board-title.canada-bc { border-bottom-color: #dc2626; color: #991b1b; }
  .board-subtitle { font-size: 0.85rem; color: #6b7280; margin-bottom: 1rem; margin-top: -0.5rem; }
  .card { border: 1px solid #e5e7eb; border-radius: 10px; padding: 1.25rem; margin-bottom: 1rem; }
  .card.top { border: 2px solid #111827; }
  .card.discarded { opacity: 0.5; }
  .label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #6b7280; margin-bottom: 0.35rem; }
  .summary-box { font-size: 0.95rem; color: #111827; background: #eef2ff; border-left: 4px solid #4f46e5; padding: 0.75rem; border-radius: 6px; margin-bottom: 0.75rem; }
  .fit-box { font-size: 0.95rem; color: #111827; background: #f0fdf4; border-left: 4px solid #16a34a; padding: 0.75rem; border-radius: 6px; margin-bottom: 0.75rem; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; }
  .card-head h4 { font-size: 1.15rem; font-weight: 700; margin: 0; }
  .confidence { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; white-space: nowrap; }
  .confidence.high { color: #16a34a; }
  .confidence.medium { color: #ca8a04; }
  .confidence.speculative { color: #6b7280; }
  dl { margin-top: 0.75rem; display: grid; gap: 0.5rem; }
  dt { font-weight: 600; font-size: 0.85rem; }
  dd { margin: 0; }
  .actions { margin-top: 1rem; display: flex; gap: 0.5rem; }
  button { font-size: 0.8rem; padding: 0.35rem 0.75rem; border-radius: 6px; cursor: pointer; }
  .btn-promote { border: 1px solid #111827; background: white; color: #111827; }
  .btn-promote.done { background: #111827; color: white; }
  .btn-discard { border: 1px solid #d1d5db; background: white; color: #6b7280; }
  .empty { color: #6b7280; font-style: italic; }
  .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; position: sticky; top: 0; background: white; padding: 0.5rem 0; z-index: 10; }
  .tab-btn { font-size: 0.85rem; font-weight: 600; padding: 0.5rem 1rem; border-radius: 999px; border: 2px solid #e5e7eb; background: white; color: #6b7280; cursor: pointer; }
  .tab-btn.active { border-color: #111827; background: #111827; color: white; }
  .tab-btn.active.far-out { border-color: #7c3aed; background: #7c3aed; }
  .tab-btn.active.canada-bc { border-color: #dc2626; background: #dc2626; }
</style>
</head>
<body>
  <h1>Opportunity Feed</h1>
  <div class="tabs">
    <button class="tab-btn active" data-filter="all" onclick="setFilter('all')">All</button>
    <button class="tab-btn" data-filter="main" onclick="setFilter('main')">Main</button>
    <button class="tab-btn" data-filter="far_out" onclick="setFilter('far_out')">Far-Out</button>
    <button class="tab-btn" data-filter="canada_bc" onclick="setFilter('canada_bc')">Canada/BC</button>
  </div>
  <div id="feed"><p class="empty">Loading...</p></div>

<script>
let currentFilter = 'all';
let allItems = [];

const confidenceClass = { high: 'high', medium: 'medium', speculative: 'speculative' };
const boardMeta = {
  main: { title: 'Main Board', subtitle: 'Grounded, buildable-now opportunities', cssClass: '' },
  far_out: { title: 'Far-Out Board', subtitle: 'Bolder, visionary ideas — still real, still viable, just bigger bets', cssClass: 'far-out' },
  canada_bc: { title: 'Canada / BC Board', subtitle: 'Opportunities rooted in Canadian or BC-specific conditions', cssClass: 'canada-bc' }
};

function setFilter(filter) {
  currentFilter = filter;
  document.querySelectorAll('.tab-btn').forEach((btn) => {
    const isActive = btn.dataset.filter === filter;
    btn.classList.toggle('active', isActive);
    btn.classList.remove('far-out', 'canada-bc');
    if (isActive && filter === 'far_out') btn.classList.add('far-out');
    if (isActive && filter === 'canada_bc') btn.classList.add('canada-bc');
  });
  render();
}

async function loadFeed() {
  const feedEl = document.getElementById('feed');
  try {
    const res = await fetch('/api/opportunities/list');
    const data = await res.json();
    allItems = data.opportunities || [];
    render();
  } catch (err) {
    feedEl.innerHTML = '<p class="empty">Failed to load feed. Check back later.</p>';
    console.error(err);
  }
}

function render() {
  const feedEl = document.getElementById('feed');
  if (allItems.length === 0) {
    feedEl.innerHTML = '<p class="empty">No opportunities yet — the first daily run hasn\'t landed.</p>';
    return;
  }

  const grouped = {};
  allItems.forEach((op) => {
    (grouped[op.report_date] = grouped[op.report_date] || []).push(op);
  });
  const dates = Object.keys(grouped).sort().reverse();
  const boardsToShow = currentFilter === 'all' ? ['main', 'far_out', 'canada_bc'] : [currentFilter];

  feedEl.innerHTML = dates.map((date) => {
    const dayItems = grouped[date];
    const byBoard = { main: [], far_out: [], canada_bc: [] };
    dayItems.forEach((op) => {
      const cat = op.category || 'main';
      (byBoard[cat] = byBoard[cat] || []).push(op);
    });
    Object.keys(byBoard).forEach((k) => byBoard[k].sort((a, b) => (a.rank || 99) - (b.rank || 99)));

    const sections = boardsToShow.map((boardKey) => boardSectionHtml(boardKey, byBoard[boardKey])).join('');
    if (!sections.trim()) return '';

    return `
      <h2 class="date">${date}</h2>
      ${sections}
    `;
  }).join('');
}

function boardSectionHtml(boardKey, items) {
  const meta = boardMeta[boardKey];
  if (!items || items.length === 0) {
    return `
      <h3 class="board-title ${meta.cssClass}">${meta.title}</h3>
      <p class="board-subtitle">${meta.subtitle}</p>
      <p class="empty">No opportunities cleared the bar for this board today.</p>
    `;
  }
  return `
    <h3 class="board-title ${meta.cssClass}">${meta.title}</h3>
    <p class="board-subtitle">${meta.subtitle}</p>
    ${items.map(cardHtml).join('')}
  `;
}

function cardHtml(op) {
  const topClass = op.is_top_recommendation ? 'top' : '';
  const discardedClass = op.status === 'discarded' ? 'discarded' : '';
  const promoted = op.status === 'promoted';
  return `
    <article class="card ${topClass} ${discardedClass}" data-id="${op.id}">
      ${op.key_summary ? `
        <div class="label">Plain-Language Summary</div>
        <p class="summary-box">${escapeHtml(op.key_summary)}</p>
      ` : ''}
      ${op.sean_fit ? `
        <div class="label">For Sean</div>
        <p class="fit-box">${escapeHtml(op.sean_fit)}</p>
      ` : ''}
      <div class="card-head">
        <h4>${op.is_top_recommendation ? '⭐ ' : ''}${escapeHtml(op.title)}</h4>
        <span class="confidence ${confidenceClass[op.confidence] || ''}">${op.confidence}</span>
      </div>
      <dl>
        <div><dt>The gap</dt><dd>${escapeHtml(op.the_gap)}</dd></div>
        <div><dt>First-principles take</dt><dd>${escapeHtml(op.first_principles_take)}</dd></div>
        <div><dt>Why now</dt><dd>${escapeHtml(op.why_now)}</dd></div>
        <div><dt>What to build first</dt><dd>${escapeHtml(op.what_to_build_first)}</dd></div>
        <div><dt>Why others missed it</dt><dd>${escapeHtml(op.why_others_missed_it)}</dd></div>
      </dl>
      <div class="actions">
        <button class="btn-promote ${promoted ? 'done' : ''}" onclick="promote('${op.id}')">${promoted ? 'Promoted ✓' : 'Promote to Inbox'}</button>
        <button class="btn-discard" onclick="discardItem('${op.id}')">Discard</button>
      </div>
    </article>
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

async function promote(id) {
  await fetch(`/api/opportunities/${id}/promote`, { method: 'POST' });
  loadFeed();
}

async function discardItem(id) {
  await fetch(`/api/opportunities/${id}/discard`, { method: 'POST' });

loadFeed();
</script>
</body>
</html>
