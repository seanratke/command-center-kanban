<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --paper: #F6F5F1;
    --card: #FFFFFF;
    --ink: #25241F;
    --ink-muted: #6E6C61;
    --border: #E1DED4;
    --sage: #3F5B4C;
    --sage-dim: #E4ECE7;
    --amber: #A97A34;
    --amber-dim: #F6ECDD;
    --violet: #6B4FA0;
    --violet-dim: #EFE9F7;
  }
  * { box-sizing: border-box; min-width: 0; }
  html, body { margin:0; background:var(--paper); overflow-x:hidden; }
  body {
    color: var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap { max-width:1200px; margin:0 auto; padding:0 20px 60px; }

  .hero { text-align:center; padding:56px 20px 30px; max-width:640px; margin:0 auto; }
  .wordmark { font-family:'Fraunces', serif; font-weight:900; font-size:clamp(38px, 9vw, 52px); letter-spacing:-0.02em; line-height:1.02; margin:0 0 10px; }
  .tagline-gradient {
    font-family:'Fraunces', serif; font-weight:600; font-style:italic; font-size:clamp(16px, 4vw, 19px); margin:0;
    background: linear-gradient(90deg, var(--sage), #6B8F7C 45%, var(--amber));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .turn-wrap { max-width:640px; margin:0 auto 30px; }
  .turn-card {
    background:var(--violet-dim);
    border:1.5px solid var(--violet);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:8px;
  }
  .turn-source { font-size:10px; font-weight:600; color:var(--violet); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:4px; }
  .turn-instruction { font-size:13.5px; color:var(--ink); line-height:1.5; margin-bottom:8px; }
  .turn-instruction b { color:var(--violet); }
  .turn-copy-btn {
    display:inline-flex; align-items:center; gap:6px;
    padding:6px 14px; border-radius:999px; border:1.5px solid var(--violet);
    background:var(--card); color:var(--violet); font-size:12px; font-weight:600;
    cursor:pointer;
  }
  .turn-copy-btn:active { transform: scale(0.98); }
  .turn-empty {
    text-align:center; font-size:13px; color:var(--ink-muted);
    padding:14px 16px; border:1px solid var(--border); border-radius:12px; background:var(--card);
  }

  #site-nav { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:0 0 30px; }
  .site-nav-link { padding:7px 14px; border-radius:999px; background:var(--card); border:1.5px solid var(--border); color:var(--ink-muted); font-size:12.5px; font-weight:600; text-decoration:none; }
  .site-nav-active { border-color:var(--sage); color:var(--sage); background:var(--sage-dim); }

  .section-label { font-size:10.5px; font-weight:600; color:var(--ink-muted); text-transform:uppercase; letter-spacing:0.05em; margin:0 0 10px; }
  .section-label.secondary { margin-top:34px; }

  .priority-card {
    background:var(--card);
    border:1px solid var(--border);
    border-left:3px solid var(--accent-color, var(--sage));
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:8px;
  }
  .priority-card.approval { --accent-color: #6B4FA0; }
  .priority-card.actnow { --accent-color: #A34A3F; }
  .priority-card.watching { --accent-color: #4A6FA0; }
  .priority-card.idea { --accent-color: var(--amber); }
  .priority-title { font-family:'Fraunces', serif; font-weight:600; font-size:14px; margin-bottom:4px; }
  .priority-reason { font-size:12px; color:var(--ink-muted); line-height:1.5; margin-bottom:4px; }
  .priority-move { font-size:11.5px; color:var(--ink); }
  .priority-move b { color:var(--accent-color, var(--sage)); font-weight:600; }
  .priority-empty { font-size:12px; color:var(--ink-muted); font-style:italic; margin-bottom:20px; }

  .status-line{ text-align:center; font-size:11.5px; color:var(--ink-muted); margin:0 0 16px; }

  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:400px){ .grid{ gap:10px; } }
  @media (min-width:820px){ .grid{ grid-template-columns:repeat(3, 1fr); } }
  @media (min-width:1080px){ .grid{ grid-template-columns:repeat(4, 1fr); } }

  .project { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; display:flex; flex-direction:column; box-shadow: 0 1px 2px rgba(37,36,31,0.03); }
  .project-head { display:flex; justify-content:space-between; align-items:flex-start; gap:6px; margin-bottom:8px; }
  .project-name { font-family:'Fraunces', serif; font-weight:600; font-size:16.5px; line-height:1.25; overflow-wrap:break-word; word-break:normal; hyphens:auto; }
  .tag { font-size:10px; color:var(--sage); background:var(--sage-dim); border-radius:6px; padding:3px 8px 3px 6px; white-space:nowrap; flex:none; display:inline-flex; align-items:center; gap:4px; }
  .tag svg { width:9px; height:9px; flex:none; }
  .output-type { font-size:10.5px; color:var(--ink-muted); border:1px solid var(--border); border-radius:6px; padding:2px 7px; display:inline-block; margin-bottom:10px; }
  .project-status { color:var(--ink-muted); font-size:12px; line-height:1.5; margin:0 0 14px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }

  .rail { display:flex; align-items:center; margin-bottom:16px; }
  .rail-step { display:flex; align-items:center; flex:1; }
  .rail-dot { width:6px; height:6px; border-radius:50%; background:var(--border); flex:none; }
  .rail-dot.done { background:var(--sage); }
  .rail-dot.current { width:9px; height:9px; background:var(--card); border:2px solid var(--sage); }
  .rail-track { flex:1; height:1px; background:var(--border); margin:0 2px; }
  .rail-track.done { background:var(--sage); }

  .foot { margin-top:auto; display:flex; flex-direction:column; gap:10px; }
  .next { font-size:11.5px; color:var(--ink-muted); line-height:1.45; }
  .next b { color:var(--amber); font-weight:600; }
  .btn { align-self:flex-start; display:inline-block; padding:6px 16px; border-radius:999px; border:1.5px solid var(--sage); color:var(--sage); text-decoration:none; font-size:12px; font-weight:600; background:transparent; }
  .btn.muted { border-color:var(--border); color:var(--ink-muted); pointer-events:none; }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <h1 class="wordmark">Command Center</h1>
    <p class="tagline-gradient">Every idea gets a home.</p>
  </div>

  <div class="turn-wrap">
    <div class="section-label" style="text-align:center;">Your turn</div>
    <div id="turn-list"><p class="turn-empty">Loading…</p></div>
  </div>

  <div id="site-nav"></div>
  <script src="/nav.js"></script>
  <script>renderSiteNav('projects');</script>

  <div class="section-label">Waiting on your approval</div>
  <div id="approval-list"><p class="priority-empty">Loading…</p></div>

  <div class="section-label">Act now</div>
  <div id="actnow-list"><p class="priority-empty">Loading…</p></div>

  <div class="section-label">Watching</div>
  <div id="watching-list"><p class="priority-empty">Loading…</p></div>

  <div class="section-label">Ideas feed</div>
  <div id="ideas-list"><p class="priority-empty">Loading…</p></div>

  <p class="status-line" id="status-line">Loading live data…</p>
  <div class="section-label">Your products</div>
  <div class="grid" id="projects"></div>

  <div class="section-label secondary">Internal tools</div>
  <div class="grid" id="internal-projects"></div>
</div>

<script>
  const sbClient = supabase.createClient(
    'https://yxfwduvwhruedjyrtfhx.supabase.co',
    'sb_publishable_aPBSSNTuFRAk0FXsiLq-wQ_J_QMcqCy'
  );
  const STAGES = ["Inbox","Lab","Validating","Building","Shipped"];

  function railHtml(currentIndex){
    let rail = "";
    STAGES.forEach((s, i) => {
      const state = i < currentIndex ? "done" : (i === currentIndex ? "current" : "");
      rail += `<div class="rail-step"><div class="rail-dot ${state}"></div>`;
      if(i < STAGES.length - 1){ rail += `<div class="rail-track ${i < currentIndex ? "done" : ""}"></div>`; }
      rail += `</div>`;
    });
    return `<div class="rail">${rail}</div>`;
  }

  const TAG_ICONS = {
    'Live & working': '<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="currentColor"/></svg>',
    'Being built': '<svg viewBox="0 0 14 14"><path d="M7 1L13 7L7 13L1 7Z" fill="currentColor"/></svg>',
    'Early research': '<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
    'Live, paused': '<svg viewBox="0 0 14 14"><rect x="3" y="2" width="3" height="10" fill="currentColor"/><rect x="8" y="2" width="3" height="10" fill="currentColor"/></svg>'
  };
  function tagIcon(tag){ return TAG_ICONS[tag] || ''; }

  function projectHtml(p){
    let btn;
    if(p.url){ btn = `<a class="btn" href="${p.url}" target="_blank">Open</a>`; }
    else if(p.slug === 'cannarecall'){ btn = `<a class="btn muted" href="#">Parked</a>`; }
    else { btn = `<a class="btn muted" href="#">Not live yet</a>`; }
    return `
      <div class="project">
        <div class="project-head">
          <div class="project-name">${p.name}</div>
          <div class="tag">${tagIcon(p.tag)}${p.tag}</div>
        </div>
        ${p.output_type ? `<div class="output-type">${p.output_type}</div>` : ""}
        <p class="project-status">${p.summary || ""}</p>
        ${railHtml(p.stage_index)}
        <div class="foot">
          <div class="next">Next: <b>${p.next_action || "—"}</b></div>
          ${btn}
        </div>
      </div>`;
  }

  function priorityCardHtml(item, kind, reasonField, moveField){
    return `
      <div class="priority-card ${kind}">
        <div class="priority-title">${item.title}</div>
        <div class="priority-reason">${item[reasonField] || ""}</div>
        ${moveField && item[moveField] ? `<div class="priority-move">Next move: <b>${item[moveField]}</b></div>` : ""}
      </div>`;
  }

  function escapeAttr(str){
    return (str || "").replace(/"/g, "&quot;");
  }

  function turnCardHtml(action){
    const sourceLabel = action.source === 'claude_code' ? 'Claude Code' : 'Chat';
    const copyBtn = action.paste_content
      ? `<button class="turn-copy-btn" onclick="navigator.clipboard.writeText(this.dataset.text); this.textContent='Copied';" data-text="${escapeAttr(action.paste_content)}">Copy text to paste</button>`
      : "";
    return `
      <div class="turn-card">
        <div class="turn-source">${sourceLabel}</div>
        <div class="turn-instruction"><b>Sean:</b> ${action.instruction}</div>
        ${copyBtn}
      </div>`;
  }

  async function loadTurn(){
    const el = document.getElementById('turn-list');
    try{
      const { data, error } = await sbClient.from('pending_actions').select('*').eq('status','open').order('created_at',{ascending:true});
      if(error) throw error;
      el.innerHTML = (data && data.length)
        ? data.map(turnCardHtml).join("")
        : `<p class="turn-empty">Nothing waiting on you right now — everything's either running on its own or caught up.</p>`;
    } catch(err){ el.innerHTML = `<p class="turn-empty">Couldn't load.</p>`; }
  }

  async function loadApproval(){
    const el = document.getElementById('approval-list');
    try{
      const { data, error } = await sbClient.from('items').select('title,approval_note').eq('awaiting_approval', true).order('updated_at',{ascending:false}).limit(5);
      if(error) throw error;
      el.innerHTML = (data && data.length) ? data.map(i => priorityCardHtml(i,'approval','approval_note',null)).join("") : `<p class="priority-empty">Nothing waiting on you.</p>`;
    } catch(err){ el.innerHTML = `<p class="priority-empty">Couldn't load.</p>`; }
  }

  async function loadActNow(){
    const el = document.getElementById('actnow-list');
    try{
      const { data, error } = await sbClient.from('items').select('title,priority_reasoning,next_move').eq('priority_flag','act_now').order('updated_at',{ascending:false}).limit(5);
      if(error) throw error;
      el.innerHTML = (data && data.length) ? data.map(i => priorityCardHtml(i,'actnow','priority_reasoning','next_move')).join("") : `<p class="priority-empty">Nothing flagged right now.</p>`;
    } catch(err){ el.innerHTML = `<p class="priority-empty">Couldn't load.</p>`; }
  }

  async function loadWatching(){
    const el = document.getElementById('watching-list');
    try{
      const { data, error } = await sbClient.from('items').select('title,priority_reasoning').eq('priority_flag','watch').order('updated_at',{ascending:false}).limit(5);
      if(error) throw error;
      el.innerHTML = (data && data.length) ? data.map(i => priorityCardHtml(i,'watching','priority_reasoning',null)).join("") : `<p class="priority-empty">Nothing on watch right now.</p>`;
    } catch(err){ el.innerHTML = `<p class="priority-empty">Couldn't load.</p>`; }
  }

  async function loadIdeas(){
    const el = document.getElementById('ideas-list');
    try{
      const [inv, syn] = await Promise.all([
        sbClient.from('inventor_ideas').select('title,priority_reasoning,next_move,created_at').eq('priority_flag','act_now'),
        sbClient.from('synthesis_ideas').select('title,priority_reasoning,next_move,created_at').eq('priority_flag','act_now')
      ]);
      const combined = [...(inv.data||[]), ...(syn.data||[])].sort((a,b) => new Date(b.created_at) - new Date(a.created_at)).slice(0,5);
      el.innerHTML = combined.length ? combined.map(i => priorityCardHtml(i,'idea','priority_reasoning','next_move')).join("") : `<p class="priority-empty">Nothing flagged right now.</p>`;
    } catch(err){ el.innerHTML = `<p class="priority-empty">Couldn't load.</p>`; }
  }

  async function loadProjects(){
    const statusLine = document.getElementById('status-line');
    const container = document.getElementById('projects');
    const internalContainer = document.getElementById('internal-projects');
    try{
      const { data, error } = await sbClient.from('meta_projects').select('*').order('sort_order');
      if(error) throw error;

      let labCount = null;
      try{
        const { count } = await sbClient.from('items').select('*', { count: 'exact', head: true }).eq('stage','lab');
        labCount = count;
      } catch(e){}

      const withLive = data.map(p => {
        if(p.slug === 'command-center' && labCount !== null){
          return { ...p, next_action: labCount > 0 ? `Review ${labCount} item${labCount === 1 ? '' : 's'} waiting in Lab` : 'Lab is clear' };
        }
        return p;
      });

      const products = withLive.filter(p => p.category !== 'internal');
      const internal = withLive.filter(p => p.category === 'internal');

      container.innerHTML = products.map(projectHtml).join("");
      internalContainer.innerHTML = internal.map(projectHtml).join("");
      statusLine.textContent = "Live from Command Center — " + new Date().toLocaleString();
    } catch(err){ statusLine.textContent = "Couldn't load live data (" + (err.message || err) + ")."; }
  }

  loadTurn();
  loadApproval();
  loadActNow();
  loadWatching();
  loadIdeas();
  loadProjects();
</script>
</body>
</html>
