<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --paper: #F6F5F1;
    --card: #FFFFFF;
    --ink: #25241F;
    --ink-muted: #6E6C61;
    --border: #E1DED4;
    --sage: #3F5B4C;
    --sage-dim: #E4ECE7;
    --amber: #A97A34;
  }
  * { box-sizing: border-box; min-width: 0; }
  html, body { margin:0; background:var(--paper); overflow-x:hidden; }
  body {
    color: var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    background: var(--paper);
    min-height:100vh;
  }
  .wrap { max-width:1200px; margin:0 auto; padding:18px 16px 60px; }

  .wordmark { font-family:'Fraunces', serif; font-weight:600; font-size:24px; letter-spacing:-0.01em; margin:0 0 12px; }
  .wordmark span { color:var(--sage); }

  #site-nav {
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:0 0 20px;
  }
  .site-nav-link {
    padding:7px 14px;
    border-radius:999px;
    background:var(--card);
    border:1.5px solid var(--border);
    color:var(--ink-muted);
    font-size:12.5px;
    font-weight:600;
    text-decoration:none;
  }
  .site-nav-active { border-color:var(--sage); color:var(--sage); background:var(--sage-dim); }

  .status-line{ font-size:11.5px; color:var(--ink-muted); margin:0 0 16px; }

  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:400px){ .grid{ gap:8px; } }

  .project {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    display:flex;
    flex-direction:column;
  }
  .project-head { display:flex; justify-content:space-between; align-items:flex-start; gap:6px; margin-bottom:7px; }
  .project-name {
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:15.5px;
    line-height:1.25;
    overflow-wrap:break-word;
    word-break:break-word;
  }
  .tag { font-size:10px; color:var(--sage); background:var(--sage-dim); border-radius:6px; padding:2px 7px; white-space:nowrap; flex:none; }
  .project-status {
    color:var(--ink-muted);
    font-size:12px;
    line-height:1.42;
    margin:0 0 12px;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .rail { display:flex; align-items:center; margin-bottom:14px; }
  .rail-step { display:flex; align-items:center; flex:1; }
  .rail-dot { width:6px; height:6px; border-radius:50%; background:var(--border); flex:none; }
  .rail-dot.done { background:var(--sage); }
  .rail-dot.current { width:9px; height:9px; background:transparent; border:2px solid var(--sage); }
  .rail-track { flex:1; height:1px; background:var(--border); margin:0 2px; }
  .rail-track.done { background:var(--sage); }

  .foot { margin-top:auto; display:flex; flex-direction:column; gap:9px; }
  .next { font-size:11.5px; color:var(--ink-muted); line-height:1.4; }
  .next b { color:var(--amber); font-weight:600; }
  .btn {
    align-self:flex-start;
    display:inline-block;
    padding:6px 15px;
    border-radius:999px;
    border:1.5px solid var(--sage);
    color:var(--sage);
    text-decoration:none;
    font-size:12px;
    font-weight:600;
    background:transparent;
  }
  .btn.muted { border-color:var(--border); color:var(--ink-muted); pointer-events:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="wordmark">Command<span> Center</span></h1>

  <div id="site-nav"></div>
  <script src="/nav.js"></script>
  <script>renderSiteNav('projects');</script>

  <p class="status-line" id="status-line">Loading live data…</p>
  <div class="grid" id="projects"></div>
</div>

<script>
  const sbClient = supabase.createClient(
    'https://yxfwduvwhruedjyrtfhx.supabase.co',
    'sb_publishable_aPBSSNTuFRAk0FXsiLq-wQ_J_QMcqCy'
  );
  const STAGES = ["Inbox","Lab","Validating","Building","Shipped"];

  function railHtml(currentIndex){
    let rail = "";
    STAGES.forEach((s, i) => {
      const state = i < currentIndex ? "done" : (i === currentIndex ? "current" : "");
      rail += `<div class="rail-step"><div class="rail-dot ${state}"></div>`;
      if(i < STAGES.length - 1){
        rail += `<div class="rail-track ${i < currentIndex ? "done" : ""}"></div>`;
      }
      rail += `</div>`;
    });
    return `<div class="rail">${rail}</div>`;
  }

  function projectHtml(p){
    let btn;
    if(p.url){
      btn = `<a class="btn" href="${p.url}" target="_blank">Open</a>`;
    } else if(p.slug === 'cannarecall'){
      btn = `<a class="btn muted" href="#">Parked</a>`;
    } else {
      btn = `<a class="btn muted" href="#">Not live yet</a>`;
    }
    return `
      <div class="project">
        <div class="project-head">
          <div class="project-name">${p.name}</div>
          <div class="tag">${p.tag}</div>
        </div>
        <p class="project-status">${p.summary || ""}</p>
        ${railHtml(p.stage_index)}
        <div class="foot">
          <div class="next">Next: <b>${p.next_action || "—"}</b></div>
          ${btn}
        </div>
      </div>`;
  }

  async function load(){
    const statusLine = document.getElementById('status-line');
    const container = document.getElementById('projects');
    try{
      const { data, error } = await sbClient.from('meta_projects').select('*').order('sort_order');
      if(error) throw error;
      container.innerHTML = data.map(projectHtml).join("");
      statusLine.textContent = "Live from Command Center — " + new Date().toLocaleString();
    } catch(err){
      statusLine.textContent = "Couldn't load live data (" + (err.message || err) + ") — check connection.";
    }
  }
  load();
</script>
</body>
</html>
