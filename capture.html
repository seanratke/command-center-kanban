<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F6F5F1"><link rel="manifest" href="/manifest.json"><title>Capture Idea</title>
<style>:root{--paper:#F6F5F1;--ink:#25241F;--muted:#706E64;--sage:#3F5B4C;--border:#DDD9CE}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;min-height:100dvh}.wrap{max-width:540px;margin:auto;padding:32px 18px}.k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--sage);font-weight:800}h1{font-size:34px;line-height:1.08;margin:8px 0}p{color:var(--muted);line-height:1.5}.card{margin-top:28px;background:white;border:1px solid var(--border);border-radius:22px;padding:18px}textarea{width:100%;min-height:160px;border:0;resize:none;font:inherit;font-size:20px;line-height:1.4;color:var(--ink);outline:0}.actions{display:grid;grid-template-columns:64px 1fr;gap:10px;margin-top:12px}button{border:0;border-radius:14px;font:inherit;font-weight:800}.mic{font-size:24px;background:#E8EEE9;color:var(--sage)}.save{padding:16px;background:var(--sage);color:white;font-size:17px}.status{min-height:24px;margin-top:14px;font-size:13px;color:var(--muted)}.done{color:var(--sage);font-weight:750}.back{display:inline-block;margin-top:22px;color:var(--muted);text-decoration:none;font-size:13px}</style></head>
<body><main class="wrap"><div class="k">SYNAPSE · Quick capture</div><h1>What's your idea?</h1><p>Raw is good. Speak or type it. It goes straight to your existing Inbox.</p><section class="card"><textarea id="idea" autofocus placeholder="I have an idea…"></textarea><div class="actions"><button id="mic" class="mic" type="button" aria-label="Speak idea">🎙</button><button id="save" class="save" type="button">Save idea</button></div><div id="status" class="status"></div></section><a class="back" href="/">← Command Center</a></main>
<script>
const idea=document.getElementById("idea"),status=document.getElementById("status"),save=document.getElementById("save"),mic=document.getElementById("mic");
async function capture(){const title=idea.value.trim();if(!title){idea.focus();return}save.disabled=true;status.textContent="Saving…";try{const r=await fetch("/api/items-add",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({title})});if(!r.ok)throw new Error("save");idea.value="";status.className="status done";status.textContent="✓ Saved to Inbox";if(navigator.vibrate)navigator.vibrate(40)}catch(e){status.className="status";status.textContent="Could not save. Try again."}finally{save.disabled=false;idea.focus()}}
save.addEventListener("click",capture);
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SpeechRecognition){mic.addEventListener("click",()=>{const r=new SpeechRecognition();r.lang=navigator.language||"en-CA";r.interimResults=false;r.onstart=()=>status.textContent="Listening…";r.onresult=e=>{idea.value=(idea.value+" "+e.results[0][0].transcript).trim();status.textContent="";idea.focus()};r.onerror=()=>status.textContent="Voice did not start. You can still type.";r.start()})}else{mic.disabled=true;mic.title="Voice capture is not available in this browser"}
</script></body></html>
