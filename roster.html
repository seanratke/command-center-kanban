<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Inventor Roster</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="manifest" href="/manifest.json" />
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 780px; margin: 0 auto; padding: 2rem 1rem; color: #111827; background: #fff; }
  h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 1rem; }
  h2.section-title { font-size: 1.2rem; font-weight: 800; margin: 2rem 0 1rem; padding-bottom: 0.4rem; border-bottom: 3px solid #111827; }
  .add-form { border: 2px dashed #d1d5db; border-radius: 10px; padding: 1.25rem; margin-bottom: 1.5rem; }
  .add-form input, .add-form textarea { width: 100%; box-sizing: border-box; padding: 8px 10px; margin-bottom: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-family: inherit; font-size: 0.9rem; }
  .inventor-block { border: 1px solid #e5e7eb; border-radius: 10px; padding: 1.25rem; margin-bottom: 1rem; }
  .inventor-block.retired { opacity: 0.5; }
  .inventor-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.5rem; }
  .inventor-name { font-size: 1.15rem; font-weight: 800; margin: 0; }
  .inventor-domain { font-size: 0.8rem; color: #a21caf; font-weight: 600; text-transform: uppercase; }
  .inventor-persona { font-size: 0.85rem; color: #374151; margin: 0 0 0.75rem; }
  .status-badge { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; }
  .status-active { background: #d1fae5; color: #065f46; }
  .status-retired { background: #f3f4f6; color: #6b7280; }
  button { font-size: 0.8rem; padding: 0.4rem 0.85rem; border-radius: 6px; cursor: pointer; }
  .btn-primary { border: 1px solid #111827; background: white; color: #111827; }
  .btn-danger { border: 1px solid #d1d5db; background: white; color: #b91c1c; }
  .empty { color: #6b7280; font-style: italic; }
</style>
</head>
<body>
  <h1>Inventor Roster</h1>
  <div style="display:flex;gap:10px;margin:0 0 24px;flex-wrap:wrap;position:sticky;top:0;z-index:100;padding:12px 0;background:#fff;">
    <a href="/" style="padding:8px 16px;border-radius:999px;background:#f3f4f6;border:2px solid #e5e7eb;color:#111827;font-size:13px;font-weight:600;text-decoration:none;">Command Center</a>
    <a href="/opportunities" style="padding:8px 16px;border-radius:999px;background:#f3f4f6;border:2px solid #e5e7eb;color:#111827;font-size:13px;font-weight:600;text-decoration:none;">Opportunities Feed</a>
    <a href="/inventors" style="padding:8px 16px;border-radius:999px;background:#f3f4f6;border:2px solid #e5e7eb;color:#111827;font-size:13px;font-weight:600;text-decoration:none;">Inventor Pool</a>
    <a href="/roster" style="padding:8px 16px;border-radius:999px;background:#f3f4f6;border:2px solid #a21caf;color:#a21caf;font-size:13px;font-weight:600;text-decoration:none;">Inventor Roster</a>
  <a href="/needs" style="padding:8px 16px;border-radius:999px;background:#f3f4f6;border:2px solid #d97706;color:#d97706;font-size:13px;font-weight:600;text-decoration:none;">Needs Attention</a>
  <a href="/projects" style="padding:8px 16px;border-radius:999px;background:#f3f4f6;border:2px solid #e5e7eb;color:#111827;font-size:13px;font-weight:600;text-decoration:none;">Projects</a>
  <a href="/" style="padding:8px 16px;border-radius:999px;background:#f3f4f6;border:2px solid #e5e7eb;color:#111827;font-size:13px;font-weight:600;text-decoration:none;">Home</a>
  </div>

  <div class="add-form">
    <div class="section-title" style="border:none;margin:0 0 10px;">Add a new inventor</div>
    <input type="text" id="new-name" placeholder="Name" />
    <input type="text" id="new-domain" placeholder="Domain (e.g. Marine Insurance)" />
    <textarea id="new-persona" rows="4" placeholder="Persona -- their worldview, obsessions, and the question they always ask"></textarea>
    <button class="btn-primary" onclick="createInventor()">Add Inventor</button>
  </div>

  <div id="content"><p class="empty">Loading...</p></div>

<script>
let inventors = [];
let editingId = null;

async function loadRoster() {
  try {
    const res = await fetch('/api/inventors/roster');
    const data = await res.json();
    inventors = data.inventors || [];
    render();
  } catch (err) {
    document.getElementById('content').innerHTML = '<p class="empty">Failed to load.</p>';
    console.error(err);
  }
}

function render() {
  const el = document.getElementById('content');
  if (inventors.length === 0) {
    el.innerHTML = '<p class="empty">No inventors yet.</p>';
    return;
  }
  el.innerHTML = inventors.map(inventorCard).join('');
}

function inventorCard(inv) {
  const retiredClass = inv.status === 'retired' ? 'retired' : '';
  const badgeClass = inv.status === 'retired' ? 'status-retired' : 'status-active';

  if (editingId === inv.id) {
    return `
      <div class="inventor-block" id="card-${inv.id}">
        <input type="text" id="edit-name-${inv.id}" value="${escapeHtml(inv.name)}" style="width:100%;box-sizing:border-box;padding:6px 8px;margin-bottom:10px;border:1px solid #d1d5db;border-radius:6px;" />
        <input type="text" id="edit-domain-${inv.id}" value="${escapeHtml(inv.domain)}" style="width:100%;box-sizing:border-box;padding:6px 8px;margin-bottom:10px;border:1px solid #d1d5db;border-radius:6px;" />
        <textarea id="edit-persona-${inv.id}" rows="6" style="width:100%;box-sizing:border-box;padding:6px 8px;margin-bottom:10px;border:1px solid #d1d5db;border-radius:6px;">${escapeHtml(inv.persona)}</textarea>
        <button class="btn-primary" onclick="saveInventor('${inv.id}')">Save</button>
        <button class="btn-danger" onclick="cancelEdit()">Cancel</button>
      </div>
    `;
  }

  return `
    <div class="inventor-block ${retiredClass}">
      <div class="inventor-header">
        <p class="inventor-name">${escapeHtml(inv.name)}</p>
        <span class="status-badge ${badgeClass}">${escapeHtml(inv.status)}</span>
      </div>
      <div class="inventor-domain" style="margin-bottom:8px;">${escapeHtml(inv.domain)}</div>
      <p class="inventor-persona">${escapeHtml(inv.persona)}</p>
      <button class="btn-primary" onclick="startEdit('${inv.id}')">Edit</button>
      ${inv.status === 'active' ? `<button class="btn-danger" onclick="retireInventor('${inv.id}')">Retire</button>` : ''}
    </div>
  `;
}

function startEdit(id) { editingId = id; render(); }
function cancelEdit() { editingId = null; render(); }

async function saveInventor(id) {
  const name = document.getElementById('edit-name-' + id).value.trim();
  const domain = document.getElementById('edit-domain-' + id).value.trim();
  const persona = document.getElementById('edit-persona-' + id).value.trim();
  if (!name || !domain || !persona) { alert('All fields are required.'); return; }
  await fetch('/api/inventors/actions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'update_inventor', id, name, domain, persona })
  });
  editingId = null;
  await loadRoster();
}

async function retireInventor(id) {
  if (!confirm('Retire this inventor? They will stop being selected for future runs.')) return;
  await fetch('/api/inventors/actions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'retire_inventor', id })
  });
  await loadRoster();
}

async function createInventor() {
  const name = document.getElementById('new-name').value.trim();
  const domain = document.getElementById('new-domain').value.trim();
  const persona = document.getElementById('new-persona').value.trim();
  if (!name || !domain || !persona) { alert('All fields are required.'); return; }
  await fetch('/api/inventors/actions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'create_inventor', name, domain, persona })
  });
  document.getElementById('new-name').value = '';
  document.getElementById('new-domain').value = '';
  document.getElementById('new-persona').value = '';
  await loadRoster();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

loadRoster();
</script>
</body>
</html>
