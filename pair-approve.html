<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Approve device</title><style>body{font-family:system-ui;background:#F6F5F1;color:#25241F;margin:0;padding:28px}.c{max-width:480px;margin:auto}button{width:100%;padding:16px;border:0;border-radius:14px;background:#3F5B4C;color:white;font-weight:800;font-size:17px}.s{margin-top:18px;color:#706E64}</style></head><body><main class="c"><h1>Approve this phone?</h1><p>Only continue if you just requested access from your phone. Approval expires automatically.</p><button id="ok">Approve phone</button><div id="s" class="s"></div></main><script>
ok.onclick=async()=>{const approvalToken=location.hash.slice(1);if(!approvalToken){s.textContent="Missing approval token.";return}ok.disabled=true;s.textContent="Approving…";const r=await fetch("/api/pair-approve",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({approvalToken})});if(r.ok){history.replaceState(null,"",location.pathname);s.textContent="Approved. Your phone can continue.";ok.remove()}else{s.textContent=r.status===401?"This browser is not a trusted Command Center device.":"Approval failed or expired.";ok.disabled=false}}
</script></body></html>
