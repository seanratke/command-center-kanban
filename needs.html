<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Needs Attention</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="manifest" href="/manifest.json" />
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 780px; margin: 0 auto; padding: 2rem 1rem; color: #111827; background: #fff; }
  h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 1rem; }
  .row { border: 1px solid #e5e7eb; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 0.75rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  .row-title { font-weight: 700; margin: 0 0 4px; }
  .row-meta { font-size: 0.8rem; color: #6b7280; }
  .badge { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .badge-opportunity { background: #eef2ff; color: #4f46e5; }
  .badge-inbox_item { background: #fef3c7; color: #92400e; }
  .badge-nomination { background: #fdf4ff; color: #a21caf; }
  .badge-inventor_idea { background: #fdf4ff; color: #a21caf; }
  .badge-synthesis { background: #ecfeff; color: #0891b2; }
  a.view-link { padding: 6px 14px; border-radius: 6px; border: 1px solid #111827; color: #111827; font-size: 0.8rem; text-decoration: none; white-space: nowrap; }
  .empty { color: #6b7280; font-style: italic; }
</style>
</head>
<body>
  <h1>Needs Attention</h1>
  <div style="display:flex;gap:10px;margin:0 0 24px;flex-wrap:wrap;position:sticky;top:0;z-index:100;padding:12px 0;background:#fff;">
    <a href="/board" style="padding:8px 16px;border-radius:999px;background:#f3f4f6;border:2px solid #e5e7eb;color:#111827;font-size:13px;font-weight:600;text-decoration:none;">Command Center</a>
    <a href="/opportunities" style="padding:8px 16px;border-radius:999px;background:#f3f4f6;border:2px solid #e5e7eb;color:#111827;font-size:13px;font-weight:600;text-decoration:none;">Opportunities Feed</a>
    <a href="/inventors" style="padding:8px 16px;border-radius:999px;background:#f3f4f6;border:2px solid #e5e7eb;color:#111827;font-size:13px;font-weight:600;text-decoration:none;">Inventor Pool</a>
    <a href="/roster" style="padding:8px 16px;border-radius:999px;background:#f3f4f6;border:2px solid #e5e7eb;color:#111827;font-size:13px;font-weight:600;text-decoration:none;">Inventor Roster</a>
    <a href="/needs" style="padding:8px 16px;border-radius:999px;background:#f3f4f6;border:2px solid #d97706;color:#d97706;font-size:13px;font-weight:600;text-decoration:none;">Needs Attention</a>
    <a href="/projects" style="padding:8px 16px;border-radius:999px;background:#f3f4f6;border:2px solid #e5e7eb;color:#111827;font-size:13px;font-weight:600;text-decoration:none;">Projects</a>
    <a href="/" style="padding:8px 16px;border-radius:999px;background:#f3f4f6;border:2px solid #e5e7eb;color:#111827;font-size:13px;font-weight:600;text-decoration:none;">Home</a>
  </div>
  <div id="content"><p class="empty">Loading...</p></div>

<script>
const typeLabels = {
  opportunity: 'Opportunity',
  inbox_item: 'Inbox Item',
  nomination: 'Nomination',
  inventor_idea: 'Inventor Idea',
  synthesis: 'Synthesis'
};

async function loadNeeds() {
  try {
    const res = await fetch('/api/needs/list');
    const data = await res.json();
    render(data.items || []);
  } catch (err) {
    document.getElementById('content').innerHTML = '<p class="empty">Failed to load.</p>';
    console.error(err);
  }
}

function daysAgo(dateStr) {
  const d = Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
  return d === 0 ? 'today' : d === 1 ? '1 day ago' : d + ' days ago';
}

function render(items) {
  const el = document.getElementById('content');
  if (items.length === 0) {
    el.innerHTML = '<p class="empty">Nothing waiting on you right now.</p>';
    return;
  }
  el.innerHTML = items.map(rowHtml).join('');
}

function rowHtml(item) {
  return `
    <div class="row">
      <div>
        <p class="row-title">${escapeHtml(item.title)}</p>
        <p class="row-meta"><span class="badge badge-${item.type}">${typeLabels[item.type] || item.type}</span> &nbsp; ${escapeHtml(String(item.meta))} &nbsp; ${daysAgo(item.created_at)}</p>
      </div>
      <a class="view-link" href="${item.link}">View</a>
    </div>
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

loadNeeds();
</script>
</body>
</html>
